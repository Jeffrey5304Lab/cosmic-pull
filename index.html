<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F4E9D7" />
    <title>Cosmic Pull</title>
    <meta name="description" content="Pull the pins, pour glowing stardust into the cups, dodge the lava. A cozy hand-drawn pull-the-pin puzzle." />
    <meta property="og:title" content="Cosmic Pull" />
    <meta property="og:description" content="Cozy pull-the-pin physics puzzle — pour stardust into every cup." />
    <meta property="og:type" content="website" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <!-- Branded start screen (first impression) -->
    <div id="title" class="title-overlay">
      <div class="title-inner">
        <svg class="title-motif" viewBox="0 0 120 150" aria-hidden="true">
          <!-- wooden pin -->
          <g transform="rotate(-16 46 44)">
            <rect x="14" y="36" width="58" height="16" rx="8" fill="#B07A46" stroke="#7A5230" stroke-width="3" />
            <circle cx="72" cy="44" r="10" fill="#F5B942" stroke="#7A5230" stroke-width="3" />
          </g>
          <!-- falling stardust -->
          <g fill="#F5B942">
            <path class="tw t1" d="M40 66 l2 5 5 2 -5 2 -2 5 -2-5 -5-2 5-2z" />
            <path class="tw t2" d="M52 84 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6-4 -4-1.6 4-1.6z" />
            <path class="tw t3" d="M44 102 l1.4 3.5 3.5 1.4 -3.5 1.4 -1.4 3.5 -1.4-3.5 -3.5-1.4 3.5-1.4z" />
          </g>
          <!-- cup with stardust -->
          <clipPath id="tcup"><rect x="36" y="112" width="40" height="30" rx="4" /></clipPath>
          <rect x="36" y="126" width="40" height="16" fill="#F5B942" clip-path="url(#tcup)" />
          <path d="M36 112 L36 142 L76 142 L76 112" fill="none" stroke="#2B2620" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
        </svg>
        <h1 class="game-logo">Cosmic <span class="accent">Pull</span></h1>
        <p class="tagline">Pull the pins · pour the stars ✦</p>
        <button id="title-play" class="btn primary big-btn">Play</button>
      </div>
    </div>

    <div id="app">
      <header class="hud">
        <button id="btn-menu" class="icon-btn" aria-label="Levels">☰</button>
        <div class="hud-center">
          <span id="level-name" class="level-name">Cosmic Pull</span>
          <span id="pull-count" class="pull-count"></span>
        </div>
        <button id="btn-sound" class="icon-btn" aria-label="Sound">♪</button>
        <button id="btn-restart" class="icon-btn" aria-label="Restart">↻</button>
      </header>

      <div id="stage" class="stage">
        <canvas id="game"></canvas>
        <div id="hint" class="hint hidden"></div>

        <!-- Level complete -->
        <div id="win" class="overlay hidden">
          <div class="card">
            <div id="win-stars" class="stars">★ ★ ★</div>
            <h2 id="win-title">Nice pull!</h2>
            <div class="card-actions">
              <button id="win-replay" class="btn ghost">Replay</button>
              <button id="win-next" class="btn primary">Next ›</button>
            </div>
            <button id="win-share" class="btn ghost share-btn">Share ✦</button>
          </div>
        </div>

        <!-- Failed -->
        <div id="lose" class="overlay hidden">
          <div class="card">
            <h2>Out of stardust…</h2>
            <p class="sub">Not enough made it into the cups.</p>
            <div class="card-actions">
              <button id="lose-retry" class="btn primary">Try again</button>
            </div>
          </div>
        </div>

        <!-- Level select -->
        <div id="menu" class="overlay hidden">
          <div class="card wide">
            <h2 class="menu-title">Cosmic <span class="accent">Pull</span></h2>
            <p id="menu-sub" class="sub"></p>
            <div id="level-grid" class="level-grid"></div>
            <a id="more-games" class="more-games" href="https://jeffrey5304lab.github.io/cosmic-merge/" target="_blank" rel="noopener">✦ More: Cosmic Merge</a>
            <button id="menu-close" class="btn ghost">Close</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
