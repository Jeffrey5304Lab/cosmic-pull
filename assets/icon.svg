<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7EFE0"/>
      <stop offset="1" stop-color="#EBDCC2"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B07A46"/>
      <stop offset="1" stop-color="#7A5230"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5B942"/>
      <stop offset="1" stop-color="#D98A1F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5B942" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F5B942" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- faint stars -->
  <g fill="#D98A1F" opacity="0.25">
    <circle cx="180" cy="180" r="7"/>
    <circle cx="850" cy="150" r="9"/>
    <circle cx="760" cy="320" r="5"/>
    <circle cx="230" cy="360" r="5"/>
    <circle cx="880" cy="470" r="6"/>
  </g>

  <!-- wooden pin, tilted, upper-left -->
  <g transform="rotate(-20 420 300)">
    <rect x="150" y="255" width="470" height="92" rx="46" fill="url(#wood)" stroke="#5f3f21" stroke-width="8"/>
    <line x1="180" y1="285" x2="590" y2="285" stroke="#3d2a17" stroke-width="4" opacity="0.35"/>
    <line x1="180" y1="315" x2="590" y2="315" stroke="#3d2a17" stroke-width="4" opacity="0.35"/>
    <circle cx="620" cy="301" r="66" fill="#F5B942" stroke="#5f3f21" stroke-width="8"/>
  </g>

  <!-- stardust stream -->
  <g fill="url(#liquid)">
    <circle cx="470" cy="470" r="26"/>
    <circle cx="512" cy="540" r="22"/>
    <circle cx="455" cy="600" r="18"/>
    <circle cx="520" cy="650" r="20"/>
    <circle cx="490" cy="712" r="16"/>
  </g>
  <circle cx="500" cy="600" r="150" fill="url(#glow)"/>

  <!-- cup with rising stardust -->
  <g>
    <clipPath id="cupClip">
      <rect x="360" y="720" width="300" height="210" rx="26"/>
    </clipPath>
    <rect x="360" y="820" width="300" height="110" fill="url(#liquid)" clip-path="url(#cupClip)"/>
    <path d="M360 720 L360 930 L660 930 L660 720" fill="none" stroke="#2B2620" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
